services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pharmawrite
      POSTGRES_USER: pharmawrite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pharmawrite_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmawrite -d pharmawrite"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://pharmawrite:${POSTGRES_PASSWORD:-pharmawrite_dev}@db:5432/pharmawrite
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
